<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Kaviel IDE tests</title>
<style>body { font: 14px/1.6 system-ui; } iframe { width: 1000px; height: 650px; border: 1px solid #888; } pre { white-space: pre-wrap; }</style>
<h1>Kaviel IDE tests</h1>
<p>Run on a local server. Tests temporarily replace and then restore the saved source.</p>
<pre id="results">Running…</pre>
<iframe id="editor" title="Editor under test"></iframe>
<script>
(async function () {
  'use strict';
  var frame = document.getElementById('editor');
  var results = document.getElementById('results');
  var passed = 0, failed = 0, log = [];
  var original = localStorage.getItem('kaviel.source');
  var originalName = localStorage.getItem('kaviel.filename');
  var originalTutorial = localStorage.getItem('kaviel.tutorial.position');
  var originalBackup = localStorage.getItem('kaviel.tutorial.backup');
  var originalDone = localStorage.getItem('kaviel.tutorial.done');
  var originalVisited = localStorage.getItem('kaviel.visited');
  var originalTheme = localStorage.getItem('kaviel.theme');
  var originalLang = localStorage.getItem('kaviel.lang');
  var originalSize = localStorage.getItem('kaviel.fontsize');
  function settle() { return new Promise(function (resolve) { setTimeout(resolve, 30); }); }
  function until(condition, timeout) {
    var started = Date.now();
    return new Promise(function (resolve, reject) {
      (function poll() {
        if (condition()) return resolve(true);
        if (Date.now() - started > (timeout || 5000)) return reject(new Error('Timed out waiting for the editor'));
        setTimeout(poll, 10);
      })();
    });
  }
  function check(name, condition) {
    if (condition) passed++; else failed++;
    log.push((condition ? 'PASS ' : 'FAIL ') + name);
  }
  var loads = 0;
  function load(hash) {
    return new Promise(function (resolve) {
      frame.onload = resolve;
      frame.src = 'kaviel.html?ide-test=' + (++loads) + (hash || '');
    });
  }
  function key(code, name, extra) {
    code.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', Object.assign({key: name, bubbles: true, cancelable: true}, extra)));
  }
  function setSource(text, start, end) {
    var code = frame.contentDocument.getElementById('code');
    code.value = text;
    code.dispatchEvent(new frame.contentWindow.Event('input', {bubbles: true}));
    code.setSelectionRange(start === undefined ? text.length : start, end === undefined ? (start === undefined ? text.length : start) : end);
    return code;
  }
  function state(doc) { return doc.body.dataset.runState; }
  function idle(doc) { return until(function () { return state(doc) === 'idle'; }); }
  async function answer(doc, win, text) {
    await until(function () { return state(doc) === 'input'; });
    var input = doc.getElementById('answer-input');
    input.value = text;
    doc.getElementById('answer-bar').dispatchEvent(new win.Event('submit', {bubbles: true, cancelable: true}));
  }
  async function runWith(doc, win, answers) {
    doc.getElementById('run').click();
    for (var i = 0; i < (answers ? answers.length : 0); i++) {
      await answer(doc, win, answers[i]);
    }
    await idle(doc);
  }
  try {
    localStorage.setItem('kaviel.source', 'start\nprint "saved"\nend');
    localStorage.setItem('kaviel.visited', '1');
    localStorage.setItem('kaviel.lang', 'en');
    localStorage.removeItem('kaviel.theme');
    localStorage.removeItem('kaviel.fontsize');
    await load();
    var doc = frame.contentDocument, win = frame.contentWindow;
    var code = doc.getElementById('code');
    check('Restores saved source', code.value.includes('"saved"'));
    check('Does not run restored source automatically', doc.getElementById('out').textContent === '');
    check('Run starts idle with Stop hidden', state(doc) === 'idle' && doc.getElementById('stop').hidden);
    check('Both panels visible before Run', doc.querySelector('.pane.output').clientHeight > 0 && doc.querySelector('.pane.problems').clientHeight > 0);
    await runWith(doc, win);
    check('Run displays output', doc.getElementById('out').textContent === 'saved');
    check('Successful run displays empty Problems state', doc.getElementById('problems').textContent === 'No problems.');
    check('Run returns to idle', state(doc) === 'idle' && doc.getElementById('stop').hidden);

    code = setSource('start\nprnt "bad"\nprint "alive"\nend');
    key(code, 'Enter', {ctrlKey: true});
    await idle(doc);
    check('Ctrl+Enter runs and continues after a language error', doc.getElementById('out').textContent === 'alive');
    var problem = doc.querySelector('button.problem');
    check('Problem is keyboard-focusable', !!problem && problem.tabIndex === 0);
    problem.click();
    check('Problem selects exact source line', code.value.slice(code.selectionStart, code.selectionEnd) === 'prnt "bad"' && doc.activeElement === code);
    check('Error marks gutter', doc.getElementById('gutter').children[1].className === 'error');
    code.dispatchEvent(new win.Event('input', {bubbles: true}));
    check('Editing clears stale diagnostic links and marks', !doc.querySelector('.problem') && !doc.querySelector('.gutter .error') && doc.getElementById('summary').textContent.includes('previous run'));

    code = setSource('x');
    key(code, 'Tab');
    check('Tab inserts two spaces and persists immediately', code.value === 'x  ' && localStorage.getItem('kaviel.source') === code.value);
    code = setSource('a\nb\nc', 0, 4);
    key(code, 'Tab');
    check('Tab indents selected lines, not next line', code.value === '  a\n  b\nc');
    key(code, 'Tab', {shiftKey: true});
    check('Shift+Tab reverses multiline indent', code.value === 'a\nb\nc');
    code = setSource('  a', 2);
    key(code, 'Tab', {shiftKey: true});
    check('Shift+Tab unindents current line', code.value === 'a' && code.selectionStart === 0);
    code = setSource('abc', 0);
    key(code, 'Tab', {shiftKey: true});
    check('Shift+Tab at start is safe', code.value === 'abc' && code.selectionStart === 0);
    code = setSource('if true');
    key(code, 'Enter');
    check('Enter indents a block by two spaces', code.value === 'if true\n  ');
    code = setSource('  print "a"');
    key(code, 'Enter');
    check('Enter preserves normal indentation', code.value === '  print "a"\n  ');
    code = setSource('');
    var paste = new win.Event('paste', {bubbles: true, cancelable: true});
    Object.defineProperty(paste, 'clipboardData', {value: {getData: function () { return '\tprint "a\tb"\r\n'; }}});
    code.dispatchEvent(paste);
    check('Paste normalizes indent tabs and CRLF, preserving string tabs', code.value === '    print "a\tb"\n');

    var examples = doc.getElementById('examples');
    examples.value = 'rps';
    examples.dispatchEvent(new win.Event('change'));
    check('Selecting example loads and saves without running', code.value.includes('ask(') && localStorage.getItem('kaviel.source') === code.value);
    check('Selecting example clears unrelated output', doc.getElementById('out').textContent === '');
    var asyncRun = win.Kaviel.runAsync;
    win.Kaviel.runAsync = function () { throw new Error('Test editor failure'); };
    doc.getElementById('run').click();
    await settle();
    check('Unexpected failure leaves readable message', doc.getElementById('summary').textContent.includes('Editor error'));
    win.Kaviel.runAsync = asyncRun;
    setSource('start\nprint "recovered"\nend');
    await runWith(doc, win);
    check('Run works again after unexpected failure', doc.getElementById('out').textContent === 'recovered');

    var askedPrompts = [];
    examples.value = 'questions';
    examples.dispatchEvent(new win.Event('change'));
    check('Numbered question example loads without asking for input', askedPrompts.length === 0 && doc.getElementById('file-name').value === 'questions.kv');
    var fixtureResponse = await fetch('examples/questions.kv');
    check('Numbered question example matches the runnable source file', fixtureResponse.ok && code.value === await fixtureResponse.text());
    doc.getElementById('run').click();
    await until(function () { return state(doc) === 'input'; });
    askedPrompts.push(doc.getElementById('answer-prompt').textContent);
    await answer(doc, win, 'Luca');
    await until(function () { return state(doc) === 'input'; });
    askedPrompts.push(doc.getElementById('answer-prompt').textContent);
    await answer(doc, win, '14');
    await idle(doc);
    check('Numbered questions open the expected prompts in order', JSON.stringify(askedPrompts) === JSON.stringify(["What's your name? ", 'How old are you? ']));
    check('Numbered answers appear in the requested sentence', doc.getElementById('out').textContent === 'Hello Luca You are 14 Years old.');
    check('Numbered example completes without problems', doc.getElementById('problems').textContent === 'No problems.');
    check('Numbered answers are highlighted as built-in values', Array.from(doc.querySelectorAll('#highlight .tok-value')).filter(function (span) { return span.textContent === 'answer'; }).length === 2);
    await runWith(doc, win, ['Ada', '21']);
    check('Running again asks again and uses only the new responses', doc.getElementById('out').textContent === 'Hello Ada You are 21 Years old.');
    check('The answer bar hides when the run ends', doc.getElementById('answer-bar').hidden && state(doc) === 'idle');
    code = setSource('start\nprint answer{9}\nprint "alive"\nend');
    await runWith(doc, win);
    doc.querySelector('button.problem').click();
    check('Missing numbered answers remain clickable diagnostics and do not stop output', doc.getElementById('out').textContent === 'alive' && code.value.slice(code.selectionStart, code.selectionEnd) === 'print answer{9}');

    code = setSource('start\nprint "ready"\ndefine keypress{1} = C\ndefine ask{1} = ("Name? ")\nif keypress{1} = ask{1}\nprint ("Hi ") answer{1}\nend');
    doc.getElementById('run').click();
    await until(function () { return state(doc) === 'key'; });
    check('Key hint names the expected key', !doc.getElementById('key-hint').hidden && doc.getElementById('key-name').textContent === 'C');
    check('Output is shown while the program waits', doc.getElementById('out').textContent === 'ready');
    doc.dispatchEvent(new win.KeyboardEvent('keydown', {key: 'x', bubbles: true, cancelable: true}));
    await settle();
    check('A wrong key keeps waiting', state(doc) === 'key' && !doc.getElementById('key-hint').hidden);
    doc.dispatchEvent(new win.KeyboardEvent('keydown', {key: 'c', bubbles: true, cancelable: true}));
    await until(function () { return state(doc) === 'input'; });
    check('The right key hides the hint and asks the question', doc.getElementById('key-hint').hidden);
    await answer(doc, win, 'Ada');
    await idle(doc);
    check('Keypress program prints both lines', doc.getElementById('out').textContent === 'ready\nHi Ada');
    check('Keypress program ends without problems', doc.getElementById('problems').textContent === 'No problems.');

    code = setSource('start\nuntil false\n  define x = 1\nend');
    doc.getElementById('run').click();
    await until(function () { return state(doc) === 'running'; });
    doc.getElementById('stop').click();
    await idle(doc);
    check('Stop ends a runaway loop', doc.getElementById('summary').textContent.includes('Stopped by you'));
    check('Stop hides itself when the run ends', doc.getElementById('stop').hidden && state(doc) === 'idle');

    code = setSource('start\n# print 42\ndefine n = 27\nprint "<img src=x onerror=alert(1)>"\nend');
    check('Highlighter preserves the exact source', doc.getElementById('highlight').textContent === code.value + '\n');
    check('Keywords, strings, comments and numbers get distinct tokens', doc.querySelector('.tok-keyword') && doc.querySelector('.tok-string') && doc.querySelector('.tok-comment') && doc.querySelector('.tok-number'));
    check('Source markup is escaped, never inserted as HTML', !doc.querySelector('#highlight img') && doc.querySelector('.tok-string').textContent.includes('<img'));
    check('Comments are not re-tokenized as keywords', doc.querySelector('.tok-comment').textContent === '# print 42' && !doc.querySelector('.tok-comment .tok-keyword'));
    var newWords = setSource('start\ndefine f(x)\n  return x\nprint f(2)\nif true and not false = print "ok"\nend');
    check('Function and logic words are highlighted', Array.from(doc.querySelectorAll('#highlight .tok-keyword')).map(function (s) { return s.textContent; }).join(' ').includes('return'));
    var css = win.getComputedStyle(code), overlayCSS = win.getComputedStyle(doc.getElementById('highlight'));
    check('Highlight and input have identical text geometry', css.fontSize === overlayCSS.fontSize && css.lineHeight === overlayCSS.lineHeight && css.padding === overlayCSS.padding && css.tabSize === overlayCSS.tabSize);

    code = setSource('print "one"\nprint "two"\nprint "one"');
    doc.getElementById('find-toggle').click();
    var query = doc.getElementById('find-query');
    query.value = 'ONE';
    query.dispatchEvent(new win.Event('input', {bubbles: true}));
    check('Find is case-insensitive and selects the first match', doc.getElementById('find-count').textContent === '1 / 2' && code.value.slice(code.selectionStart, code.selectionEnd) === 'one');
    doc.getElementById('find-bar').dispatchEvent(new win.Event('submit', {bubbles: true, cancelable: true}));
    check('Find moves to the next match', doc.getElementById('find-count').textContent === '2 / 2');
    doc.getElementById('find-bar').dispatchEvent(new win.Event('submit', {bubbles: true, cancelable: true}));
    check('Find wraps at the last match', doc.getElementById('find-count').textContent === '1 / 2');
    doc.getElementById('find-prev').click();
    check('Find previous wraps backward', doc.getElementById('find-count').textContent === '2 / 2');
    query.value = 'missing';
    query.dispatchEvent(new win.Event('input', {bubbles: true}));
    check('Find reports no matches', doc.getElementById('find-count').textContent === 'No matches');
    query.dispatchEvent(new win.KeyboardEvent('keydown', {key: 'Escape', bubbles: true, cancelable: true}));
    check('Escape closes search and returns focus to source', doc.getElementById('find-bar').hidden && doc.activeElement === code);
    code.dispatchEvent(new win.KeyboardEvent('keydown', {key: 'f', ctrlKey: true, bubbles: true, cancelable: true}));
    check('Ctrl+F opens the editor search', !doc.getElementById('find-bar').hidden && doc.activeElement === query);
    doc.getElementById('find-close').click();

    doc.getElementById('guide-toggle').click();
    check('Language guide opens as a modal', doc.getElementById('guide').open && doc.getElementById('guide-toggle').getAttribute('aria-expanded') === 'true');
    check('Guide examples contain real line breaks', Array.from(doc.querySelectorAll('.guide-grid pre')).every(function (pre) { return pre.textContent.includes('\n') && !pre.textContent.includes('\\n'); }));
    check('Guide examples run without language errors', Array.from(doc.querySelectorAll('.guide-grid pre')).every(function (pre, i) {
      var source = i === 0 ? pre.textContent : 'start\ndefine score = 5\n' + pre.textContent + '\nend';
      return win.Kaviel.run(source, {input: function () { return 'test'; }, keypress: function (wanted) { return wanted === 'Space' ? ' ' : wanted; }, rng: function () { return 0.5; }}).errors === 0;
    }));
    doc.getElementById('guide-close').click();
    await settle();
    check('Language guide closes and restores its expanded state', !doc.getElementById('guide').open && doc.getElementById('guide-toggle').getAttribute('aria-expanded') === 'false');

    localStorage.removeItem('kaviel.tutorial.position');
    localStorage.removeItem('kaviel.tutorial.backup');
    localStorage.removeItem('kaviel.tutorial.done');
    localStorage.removeItem('kaviel.visited');
    await load();
    doc = frame.contentDocument; win = frame.contentWindow; code = doc.getElementById('code');
    var T = win.KavielTutorials;
    check('A first visit opens the lessons panel', !doc.getElementById('tutorial').hidden && doc.getElementById('tutorials-toggle').getAttribute('aria-expanded') === 'true');
    await load();
    doc = frame.contentDocument; win = frame.contentWindow; code = doc.getElementById('code');
    check('Later visits keep the panel closed', doc.getElementById('tutorial').hidden && doc.getElementById('tutorials-toggle').getAttribute('aria-expanded') === 'false');
    doc.getElementById('tutorials-toggle').click();
    check('The Lessons button opens the panel beside the editor', !doc.getElementById('tutorial').hidden && doc.getElementById('code').clientHeight > 0);
    check('Every lesson is listed', T.length >= 10 && doc.querySelectorAll('.tutorial-lesson').length === T.length);
    doc.querySelectorAll('.tutorial-lesson')[7].click();
    check('Choosing a lesson shows its first step', doc.querySelector('.tutorial-step h3').textContent === 'Make a command' && doc.querySelector('.tutorial-code').textContent.includes('define greet(name)') && !!doc.querySelector('.code-row .note') && !!doc.querySelector('.see-box'));
    doc.querySelectorAll('.nav-row .btn')[1].click();
    check('Next step moves forward inside the lesson', doc.querySelector('.tutorial-step .step-count').textContent.includes('step 2 of 4'));
    check('Steps give the reader a small job', !!doc.querySelector('.your-turn'));
    var sourceBeforeTutorial = setSource('start\nprint "mine"\nend').value;
    doc.querySelector('.step-actions .put-code').click();
    check('Putting a step in the editor loads its code and keeps the panel open', !doc.getElementById('tutorial').hidden && code.value.includes('define area(width, height)'));
    check('The previous code is kept for restoring', localStorage.getItem('kaviel.tutorial.backup') === sourceBeforeTutorial);
    check('Tutorial progress is remembered', JSON.parse(localStorage.getItem('kaviel.tutorial.position')).lesson === 7);
    doc.querySelector('.restore-code').click();
    check('Restore brings the previous code back', code.value === sourceBeforeTutorial);
    doc.getElementById('tab-examples').click();
    check('The Examples tab shows the example list', !doc.getElementById('examples-view').hidden && doc.getElementById('lessons-view').hidden && doc.querySelectorAll('#example-list button').length === 16);
    doc.getElementById('tab-lessons').click();
    doc.getElementById('tutorial-close').click();
    check('Close hides the panel and drops its expanded state', doc.getElementById('tutorial').hidden && doc.getElementById('tutorials-toggle').getAttribute('aria-expanded') === 'false');
    doc.getElementById('tutorials-toggle').click();
    var tutorialSources = [], walked = [];
    for (var lessonIndex = 0; lessonIndex < T.length; lessonIndex++) {
      doc.querySelector('.back-link').click();
      doc.querySelectorAll('.tutorial-lesson')[lessonIndex].click();
      for (var stepIndex = 0; stepIndex < T[lessonIndex].steps.length; stepIndex++) {
        walked.push(doc.querySelector('.tutorial-step h3').textContent);
        tutorialSources.push({source: T[lessonIndex].steps[stepIndex].code, expectErrors: !!T[lessonIndex].steps[stepIndex].expectErrors});
        if (stepIndex < T[lessonIndex].steps.length - 1) doc.querySelectorAll('.nav-row .btn')[1].click();
      }
    }
    check('The panel shows every step of every lesson', walked.length === T.reduce(function (n, l) { return n + l.steps.length; }, 0) && walked.length >= 40);
    check('Every tutorial step runs as intended', tutorialSources.every(function (item) {
      var asked = 0;
      var outcome = win.Kaviel.run(item.source, {input: function () { return String(asked++ % 10 + 1); }, keypress: function (wanted) { return wanted === 'Space' ? ' ' : wanted; }, rng: function () { return 0.5; }});
      return item.expectErrors ? outcome.errors > 0 : outcome.errors === 0;
    }));
    doc.querySelectorAll('.nav-row .btn')[1].click();
    check('Finishing a lesson ticks it off', JSON.parse(localStorage.getItem('kaviel.tutorial.done')).indexOf(T.length - 1) >= 0 && doc.querySelectorAll('.tutorial-lesson.done').length >= 1);
    doc.getElementById('tutorial-close').click();
    check('Every step has a short note for each known line of code', T.every(function (l) { return l.steps.every(function (st) { return st.text && st.text.length > 60 && st.see && st.turn; }); }));
    var packs = win.KavielLessons;
    check('Italian and French have the same lessons and steps as English', ['it', 'fr'].every(function (l) {
      return packs[l].lessons.length === packs.en.lessons.length && packs[l].lessons.every(function (row, i) { return row[2].length === packs.en.lessons[i][2].length && row[2].every(function (st) { return st.length === 5 && st[1] && st[2] && st[3]; }); }) &&
        Object.keys(packs.en.explain).every(function (k) { return packs[l].explain[k]; });
    }));
    doc.querySelectorAll('.nav-row .btn')[1].click();
    doc.querySelector('.back-link') && doc.querySelector('.back-link').click();
    doc.querySelectorAll('.tutorial-lesson')[T.length - 1].click();
    var typeButton = doc.querySelector('.step-actions .type-it');
    var keepSource = setSource('start\nprint "mine"\nend').value;
    typeButton.click();
    check('Type it yourself gives an empty page ready to type in', code.value === 'start\n\nend\n' && code.selectionStart === 6 && localStorage.getItem('kaviel.tutorial.backup') === keepSource);
    var finalStep = T[T.length - 1].steps[T[T.length - 1].steps.length - 1];
    check('The last lesson ends with the full treasure game', finalStep.code.indexOf('until day > 3') > 0 && finalStep.code.indexOf('random 70') > 0);

    var listen = doc.querySelector('.tutorial-step .listen');
    check('Every lesson step offers a Listen button', !!listen && listen.getAttribute('aria-pressed') === 'false' && listen.textContent.trim().length > 3);
    var listeningWorks = true;
    try {
      listen.click();
      listen.click();
      listeningWorks = listen.getAttribute('aria-pressed') === 'false';
    } catch (e) { listeningWorks = false; }
    check('Reading a step aloud starts and stops without errors', listeningWorks);

    doc = frame.contentDocument; win = frame.contentWindow; code = doc.getElementById('code'); examples = doc.getElementById('examples');
    var pairs = [['hello', 'hello.kv'], ['questions', 'questions.kv'], ['age', 'age.kv'], ['dice', 'dice.kv'], ['collatz', 'collatz.kv'], ['rps', 'rock_paper_scissors.kv'], ['functions', 'functions.kv'], ['lists', 'lists.kv'], ['keypress', 'keypress.kv'], ['errors', 'errors.kv'], ['guess', 'guess.kv'], ['timestable', 'timestable.kv'], ['quiz', 'quiz.kv'], ['treasure', 'treasure_hunt.kv'], ['foreach', 'foreach.kv'], ['citadel', 'citadel.kv']];
    var inSync = true, examplesRun = true;
    for (var pair = 0; pair < pairs.length; pair++) {
      examples.value = pairs[pair][0];
      examples.dispatchEvent(new win.Event('change'));
      var file = await (await fetch('examples/' + pairs[pair][1])).text();
      if (code.value !== file) inSync = false;
      if (pairs[pair][0] !== 'errors') {
        var outcome = win.Kaviel.run(code.value, {input: function () { return '14'; }, keypress: function (wanted) { return wanted === 'Space' ? ' ' : wanted; }, rng: function () { return 0.5; }});
        if (outcome.errors !== 0) examplesRun = false;
      }
    }
    check('Every example in the explorer matches its source file', inSync);
    check('Every example runs without language errors', examplesRun);

    doc.querySelector('[data-example="collatz"]').click();
    check('Explorer examples load source and update the file name', code.value.includes('define n = 27') && doc.getElementById('file-name').value === 'collatz.kv');
    check('Explorer identifies the selected example', doc.querySelector('[data-example="collatz"]').getAttribute('aria-current') === 'true');
    await runWith(doc, win);
    check('Elapsed time appears after Run', /ms$/.test(doc.getElementById('execution-time').textContent));
    await settle();
    check('Output placeholder hides after printing', doc.getElementById('output-placeholder').hidden);
    var sourceBeforeClear = code.value;
    doc.getElementById('clear-output').click();
    check('Clear output does not change source', doc.getElementById('out').textContent === '' && code.value === sourceBeforeClear);
    check('Cursor position is updated', (function () { code.setSelectionRange(6, 6); code.dispatchEvent(new win.Event('click')); return doc.getElementById('cursor-position').textContent === 'Ln 2, Col 1'; })());
    code = setSource(Array.from({length: 100}, function (_, i) { return 'print "' + i + ' ' + 'x'.repeat(200) + '"'; }).join('\n'));
    code.scrollTop = 240;
    code.scrollLeft = 100;
    code.dispatchEvent(new win.Event('scroll'));
    check('Horizontal and vertical highlight scrolling follow source', doc.getElementById('highlight').scrollTop === code.scrollTop && doc.getElementById('highlight').scrollLeft === code.scrollLeft && doc.getElementById('gutter').scrollTop === code.scrollTop);

    var download = null, savedBlob = null;
    var originalClick = win.HTMLAnchorElement.prototype.click, originalURL = win.URL.createObjectURL;
    win.HTMLAnchorElement.prototype.click = function () { download = this.download; };
    win.URL.createObjectURL = function (blob) { savedBlob = blob; return originalURL.call(win.URL, blob); };
    doc.getElementById('save-file').click();
    var savedText = await savedBlob.text();
    check('Save prepares a .kv download with exact source bytes', download === 'collatz.kv' && savedText === code.value);
    download = null;
    code.dispatchEvent(new win.KeyboardEvent('keydown', {key: 's', ctrlKey: true, bubbles: true, cancelable: true}));
    check('Ctrl+S saves source rather than the HTML page', download === 'collatz.kv');
    win.HTMLAnchorElement.prototype.click = originalClick;
    win.URL.createObjectURL = originalURL;

    async function importFile(file) {
      var transfer = new win.DataTransfer();
      transfer.items.add(file);
      var previousToast = doc.getElementById('toast').textContent;
      doc.getElementById('file-input').files = transfer.files;
      doc.getElementById('file-input').dispatchEvent(new win.Event('change'));
      for (var wait = 0; wait < 100 && doc.getElementById('toast').textContent === previousToast; wait++) await settle();
    }
    await importFile(new win.File(['\uFEFFstart\r\nprint "imported"\r\nend'], 'imported.kv', {type: 'text/plain'}));
    check('Open imports local source and normalizes BOM and CRLF', code.value === 'start\nprint "imported"\nend' && doc.getElementById('file-name').value === 'imported.kv');
    check('Imported files are saved locally without execution', localStorage.getItem('kaviel.source') === code.value && doc.getElementById('out').textContent === '');
    var importedSource = code.value;
    await importFile(new win.File(['not source'], 'invalid.png'));
    check('Open rejects unsupported file types without replacing source', code.value === importedSource && doc.getElementById('toast').textContent.includes('.kv'));
    await importFile(new win.File(['x'.repeat(1024 * 1024 + 1)], 'large.kv'));
    check('Open rejects oversized files without replacing source', code.value === importedSource && doc.getElementById('toast').textContent.includes('1 MB'));
    var fileText = win.File.prototype.text, finishRead;
    win.File.prototype.text = function () { return new Promise(function (resolve) { finishRead = resolve; }); };
    var delayed = new win.DataTransfer();
    delayed.items.add(new win.File(['unused'], 'delayed.kv'));
    doc.getElementById('file-input').files = delayed.files;
    doc.getElementById('file-input').dispatchEvent(new win.Event('change'));
    setSource('start\nprint "newer edit"\nend');
    finishRead('start\nprint "older file"\nend');
    await settle();
    check('Async file reads do not overwrite newer source edits', code.value.includes('newer edit') && doc.getElementById('toast').textContent.includes('code changed'));
    win.File.prototype.text = fileText;
    var storageSet = win.Storage.prototype.setItem;
    win.Storage.prototype.setItem = function () { throw new Error('Storage unavailable'); };
    setSource('start\nprint "not saved"\nend');
    check('Storage failures are shown instead of claiming the draft was saved', doc.getElementById('save-state').textContent.includes('Not saved'));
    win.Storage.prototype.setItem = storageSet;
    setSource('start\nprint "recovered"\nend');

    // New file, rename, drag and drop, edited marker, theme and text size.
    doc = frame.contentDocument; win = frame.contentWindow; code = doc.getElementById('code');
    setSource('start\nprint "keep me"\nend');
    check('Typing shows the edited marker', !doc.getElementById('edited').hidden);
    doc.getElementById('new-file').click();
    check('New starts an empty program with a start and end', code.value === 'start\n\nend\n' && doc.getElementById('file-name').value === 'untitled.kv' && doc.getElementById('edited').hidden);
    check('New offers Undo and Undo brings the old code back', !doc.getElementById('toast-action').hidden);
    doc.getElementById('toast-action').click();
    check('Undo restores the previous program', code.value === 'start\nprint "keep me"\nend');
    var nameBox = doc.getElementById('file-name');
    nameBox.value = 'my game';
    nameBox.dispatchEvent(new win.Event('change'));
    check('Renaming adds .kv and keeps the name as plain text', nameBox.value === 'my game.kv' && localStorage.getItem('kaviel.filename') === 'my game.kv');
    nameBox.value = '../evil<b>.kv';
    nameBox.dispatchEvent(new win.Event('change'));
    check('A rename cannot hold a path', nameBox.value.indexOf('/') < 0);
    var dropped = new win.DataTransfer();
    dropped.items.add(new win.File(['start\nprint "dropped"\nend'], 'dropped.kv'));
    var previousToastText = doc.getElementById('toast-text').textContent;
    doc.dispatchEvent(new win.DragEvent('drop', {dataTransfer: dropped, bubbles: true, cancelable: true}));
    for (var waits = 0; waits < 100 && doc.getElementById('toast-text').textContent === previousToastText; waits++) await settle();
    check('Dropping a .kv file opens it', code.value.includes('"dropped"') && doc.getElementById('file-name').value === 'dropped.kv' && doc.getElementById('edited').hidden);
    var themeBefore = doc.documentElement.dataset.theme || '';
    doc.getElementById('theme-toggle').click();
    check('The theme button switches and remembers the theme', doc.documentElement.dataset.theme && doc.documentElement.dataset.theme !== themeBefore && localStorage.getItem('kaviel.theme') === doc.documentElement.dataset.theme);
    doc.getElementById('bigger').click();
    var sizeNow = win.getComputedStyle(code).fontSize;
    check('Bigger text grows the editor and highlight together', sizeNow === '16px' && win.getComputedStyle(doc.getElementById('highlight')).fontSize === '16px' && win.getComputedStyle(code).lineHeight === win.getComputedStyle(doc.getElementById('highlight')).lineHeight && localStorage.getItem('kaviel.fontsize') === '16');
    doc.getElementById('smaller').click();
    check('Smaller text brings it back', win.getComputedStyle(code).fontSize === '15px');

    // Italian and French: the text in quotes is translated, the code still works.
    var literalPattern = /"((?:[^"\\\n]|\\.)*)"/g;
    function literalsOf(source) { var found = []; source.replace(literalPattern, function (_, inner) { found.push(inner); return ''; }); return found; }
    var keepAsIs = ['Ada', 'Luca', '!', '4', 'La la la!', 'x 7 =', 'Wow, ', 'Wow!', 'Hi', 'Count:'];
    var dictionary = {};
    win.KavielStrings.forEach(function (row) { dictionary[row[0]] = true; });
    var everyLiteral = [];
    T.forEach(function (lesson) { lesson.steps.forEach(function (step) { everyLiteral = everyLiteral.concat(literalsOf(step.code)); }); });
    for (var fileName of ['hello', 'questions', 'age', 'dice', 'collatz', 'rock_paper_scissors', 'functions', 'lists', 'keypress', 'errors', 'guess', 'timestable', 'quiz', 'treasure_hunt']) {
      everyLiteral = everyLiteral.concat(literalsOf(await (await fetch('examples/' + fileName + '.kv')).text()));
    }
    var untranslated = everyLiteral.filter(function (text) { return !dictionary[text] && keepAsIs.indexOf(text) < 0 && !/^\W*$/.test(text); });
    check('Every quoted phrase in the lessons and examples has a translation', untranslated.length === 0);
    if (untranslated.length) log.push('  missing: ' + JSON.stringify(Array.from(new Set(untranslated))));
    for (var langCode of ['it', 'fr']) {
      localStorage.setItem('kaviel.lang', langCode);
      await load();
      doc = frame.contentDocument; win = frame.contentWindow; code = doc.getElementById('code');
      var TT = win.KavielTutorials;
      check(langCode + ': the page language and selector follow the choice', doc.documentElement.lang === langCode && doc.getElementById('lang').value === langCode);
      check(langCode + ': the interface is translated', doc.getElementById('run').textContent.trim() !== 'Run' && doc.getElementById('tutorials-toggle').textContent.trim() !== 'Lessons');
      check(langCode + ': lesson code keeps English keywords and translates the quoted text', TT[1].steps[0].code.indexOf('print "') > 0 && TT[1].steps[0].code.indexOf('Hello') < 0);
      check(langCode + ': every lesson step still runs as intended', TT.every(function (lesson) { return lesson.steps.every(function (step) {
        var asked = 0;
        var outcome = win.Kaviel.run(step.code, {input: function () { return String(asked++ % 10 + 1); }, keypress: function (wanted) { return wanted === 'Space' ? ' ' : wanted; }, rng: function () { return 0.5; }});
        return step.expectErrors ? outcome.errors > 0 : outcome.errors === 0;
      }); }));
      var quizSource = TT[TT.length - 2].steps[1].code;
      var answers = langCode === 'it' ? ['sinistra', 'destra', 'sinistra'] : ['gauche', 'droite', 'gauche'];
      var played = win.Kaviel.run(TT[TT.length - 1].steps[4].code, {input: (function () { var i = -1, list = ['Ada'].concat(answers); return function () { return list[++i]; }; })(), rng: function () { return 0; }});
      check(langCode + ': the treasure game works with translated answers', played.errors === 0 && played.output.join('\n').indexOf(langCode === 'it' ? 'Entri in una grotta' : 'Tu entres dans une grotte') >= 0 && /ricco|riche/.test(played.output.join('\n')));
      var savedExamples = doc.getElementById('examples');
      savedExamples.value = 'quiz';
      savedExamples.dispatchEvent(new win.Event('change'));
      var quizAnswers = langCode === 'it' ? ['4', 'verde'] : ['4', 'vert'];
      var quizRun = win.Kaviel.run(code.value, {input: (function () { var i = -1; return function () { return quizAnswers[++i]; }; })()});
      check(langCode + ': the quiz example accepts the translated right answers', quizRun.errors === 0 && quizRun.output.join(' ').indexOf(langCode === 'it' ? 'Hai preso 2 su 2' : 'Tu as eu 2 sur 2') >= 0);
      doc.getElementById('guide-toggle').click();
      check(langCode + ': the help examples are translated and still run', Array.from(doc.querySelectorAll('.guide-grid pre')).every(function (pre, i) {
        var source = i === 0 ? pre.textContent : 'start\ndefine score = 5\n' + pre.textContent + '\nend';
        return win.Kaviel.run(source, {input: function () { return 'test'; }, keypress: function (w) { return w; }, rng: function () { return 0.5; }}).errors === 0;
      }) && doc.querySelector('.guide-grid pre').textContent.indexOf('Hello') < 0);
      doc.getElementById('guide-close').click();
    }
    localStorage.setItem('kaviel.lang', 'en');
    await load();
    doc = frame.contentDocument; win = frame.contentWindow; code = doc.getElementById('code');

    var savedNameBeforeHash = localStorage.getItem('kaviel.filename');
    await load('#collatz');
    check('Hash loads the requested example', frame.contentDocument.getElementById('code').value.includes('define n = 27'));
    check('Loading a hash example does not rename the saved draft', localStorage.getItem('kaviel.filename') === savedNameBeforeHash);
    await load('#%');
    check('Malformed hash does not break editor initialization', frame.contentDocument.getElementById('gutter').children.length > 0);
    await load('#toString');
    check('Inherited object names are not examples', frame.contentDocument.getElementById('code').value === localStorage.getItem('kaviel.source'));
    localStorage.setItem('kaviel.source', '');
    await load();
    check('Empty saved source remains empty', frame.contentDocument.getElementById('code').value === '');
    // Symbols bar and the download button.
    doc = frame.contentDocument; win = frame.contentWindow; code = doc.getElementById('code');
    var symbolButtons = doc.querySelectorAll('.symbols [data-insert]');
    function symb(mark) {
      for (var s = 0; s < symbolButtons.length; s++) if (symbolButtons[s].dataset.insert === mark) return symbolButtons[s];
      return null;
    }
    check('The symbol bar carries the characters that are hard to type', symbolButtons.length >= 8 && !!symb('"') && !!symb('{') && !!symb('}') && !!symb('[') && !!symb(']'));
    setSource('start\n\nend\n', 6, 6);
    symb('"').click();
    check('A symbol goes in where the cursor is', code.value === 'start\n"\nend\n' && code.selectionStart === 7);
    setSource('define x = ', 11, 11);
    symb('{').click();
    symb('}').click();
    check('Curly brackets can be typed with two clicks', code.value === 'define x = {}' && code.selectionStart === 13);
    setSource('print 1', 6, 7);
    symb('(').click();
    check('A symbol replaces selected text', code.value === 'print (' && code.selectionStart === 7);
    check('Using a symbol marks the file as edited', doc.getElementById('edited').hidden === false);
    var download = doc.getElementById('download');
    var downloadHref = download.getAttribute('href');
    check('The download button points at the installer for this system', !!download && /(application\/|releases\/download\/.+\/)Kaviel-.+\.(dmg|exe|tar\.gz)$/.test(downloadHref));
    doc.documentElement.dataset.desktop = '1';
    check('The desktop app hides the download button', win.getComputedStyle(download).display === 'none');
    delete doc.documentElement.dataset.desktop;

    // The installers are not kept in the repository, so the page is checked twice:
    // with the file present it must download, without it must say so instead of opening a broken page.
    var localInstaller = downloadHref;
    var installerHere = false;
    try {
      installerHere = (await fetch(localInstaller, {method: 'HEAD'})).ok;
    } catch (e) { installerHere = false; }
    if (win.KAVIEL_APP && win.KAVIEL_APP.release) {
      check('Over the web the download goes to the release, not to a missing file', downloadHref.indexOf(win.KAVIEL_APP.release) === 0 && !download.hasAttribute('download'));
    } else if (installerHere) {
      var clickedDownload = doc.getElementById('download');
      clickedDownload.click();
      check('An installer that exists is downloaded, not reported as missing', doc.getElementById('toast').hidden || doc.getElementById('toast-text').textContent.indexOf('Kaviel-1.0.0-beta-') < 0);
    } else {
      var missingReported = false;
      try {
        doc.getElementById('download').click();
        await until(function () { return !doc.getElementById('toast').hidden; }, 3000);
        missingReported = doc.getElementById('toast-text').textContent.indexOf('Kaviel-1.0.0-beta-') > 0;
      } catch (e) { missingReported = false; }
      check('A missing installer is reported instead of opening a broken page', missingReported);
    }

    frame.style.width = '390px';
    doc = frame.contentDocument;
    check('Narrow layout keeps editor and both panels visible', doc.getElementById('code').clientHeight > 0 && doc.querySelector('.pane.output').clientHeight > 0 && doc.querySelector('.pane.problems').clientHeight > 0 && doc.documentElement.scrollWidth <= 390);
    doc.getElementById('tutorials-toggle').click();
    check('Tutorials stay usable on a narrow screen', !doc.getElementById('tutorial').hidden && doc.querySelectorAll('.tutorial-lesson').length === T.length);
    doc.getElementById('tutorial-close').click();
  } catch (error) {
    failed++;
    log.push('FAIL test runner: ' + error.stack);
  } finally {
    if (original === null) localStorage.removeItem('kaviel.source');
    else localStorage.setItem('kaviel.source', original);
    if (originalName === null) localStorage.removeItem('kaviel.filename');
    else localStorage.setItem('kaviel.filename', originalName);
    if (originalTutorial === null) localStorage.removeItem('kaviel.tutorial.position');
    else localStorage.setItem('kaviel.tutorial.position', originalTutorial);
    if (originalDone === null) localStorage.removeItem('kaviel.tutorial.done'); else localStorage.setItem('kaviel.tutorial.done', originalDone);
    if (originalVisited === null) localStorage.removeItem('kaviel.visited'); else localStorage.setItem('kaviel.visited', originalVisited);
    if (originalLang === null) localStorage.removeItem('kaviel.lang'); else localStorage.setItem('kaviel.lang', originalLang);
    if (originalTheme === null) localStorage.removeItem('kaviel.theme'); else localStorage.setItem('kaviel.theme', originalTheme);
    if (originalSize === null) localStorage.removeItem('kaviel.fontsize'); else localStorage.setItem('kaviel.fontsize', originalSize);
    if (originalBackup === null) localStorage.removeItem('kaviel.tutorial.backup');
    else localStorage.setItem('kaviel.tutorial.backup', originalBackup);
    results.textContent = passed + ' passed, ' + failed + ' failed\n' + log.join('\n');
    document.title = failed ? 'FAIL — Kaviel IDE tests' : 'PASS — Kaviel IDE tests';
    document.body.dataset.failed = String(failed);
  }
})();
</script>
</html>
