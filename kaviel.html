<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaviel — editor</title>
<style>
  :root {
    --bg: #0e1014;
    --panel: #14171d;
    --line: #232833;
    --text: #e6e9ef;
    --quiet: #8b93a3;
    --accent: #7cc4ff;
    --err: #ff6b6b;
    --warn: #e8c15a;
    --ok: #67d98b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  header h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: .04em; }
  header .tag { font-size: 12px; color: var(--quiet); margin-left: 2px; }
  header .spacer { flex: 1; }
  button, select {
    background: #1b2029;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 11px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #39414f; }
  button.run { background: #1d3b53; border-color: #2b5a7d; color: #d8ecff; font-weight: 600; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 42%); overflow: hidden; }

  .editor { display: flex; min-width: 0; border-right: 1px solid var(--line); background: #0c0e12; }
  .gutter {
    flex: none;
    width: 52px;
    padding: 12px 8px 40px 0;
    text-align: right;
    font: 13px/22px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #39404e;
    overflow: hidden;
    user-select: none;
    background: #0a0c10;
    border-right: 1px solid #181c24;
  }
  .gutter div { position: relative; }
  .gutter div.error { color: var(--err); font-weight: 700; }
  .gutter div.warning { color: var(--warn); font-weight: 700; }
  textarea {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: var(--text);
    padding: 12px 16px 40px 12px;
    font: 13px/22px ui-monospace, SFMono-Regular, Menlo, monospace;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
  }

  .side { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .pane { display: flex; flex-direction: column; min-height: 0; }
  .pane.output { flex: 1 1 46%; border-bottom: 1px solid var(--line); }
  .pane.problems { flex: 1 1 54%; }
  .pane-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--quiet);
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .pane-head .count { color: var(--quiet); text-transform: none; letter-spacing: 0; font-size: 12px; }
  .pane-body { overflow: auto; padding: 10px 14px 16px; flex: 1; }
  pre.out {
    margin: 0;
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    color: #dfe4ec;
  }
  pre.out:empty::after { content: "nothing to show"; color: #3f4653; }
  .problem {
    display: grid;
    grid-template-columns: 58px 1fr;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px dashed #1c212a;
    cursor: pointer;
  }
  button.problem { width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px dashed #1c212a; border-radius: 0; }
  .problem:last-child { border-bottom: 0; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .empty { color: var(--quiet); font-size: 13px; }
  @media (max-width: 700px) {
    header { flex-wrap: wrap; gap: 8px; }
    header .tag { display: none; }
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(160px, 1fr) minmax(180px, 1fr); }
    .editor { border-right: 0; border-bottom: 1px solid var(--line); }
    .side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .pane.output { border-bottom: 0; border-right: 1px solid var(--line); }
  }
  .problem .where {
    font: 12px/1.6 ui-monospace, Menlo, monospace;
    color: var(--quiet);
  }
  .problem.error .where { color: var(--err); }
  .problem.warning .where { color: var(--warn); }
  .problem .msg { font-size: 13px; }
  .problem .hint { color: var(--quiet); font-size: 12px; margin-top: 2px; }
  .problem .kind { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--quiet); }
  .ok { color: var(--ok); }
  .summary { padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--quiet); flex: none; }
</style>
</head>
<body>

<header>
  <h1>Kaviel</h1>
  <span class="tag">the language that speaks</span>
  <select id="examples" title="Examples">
    <option value="">Examples…</option>
    <option value="hello">Hello</option>
    <option value="dice">Dice 67 / 33</option>
    <option value="rps">Rock, paper, scissors</option>
    <option value="collatz">Collatz</option>
    <option value="errors">Tour of errors</option>
  </select>
  <div class="spacer"></div>
  <button class="run" id="run">Run ⌘↵</button>
</header>

<main>
  <section class="editor">
    <div class="gutter" id="gutter"></div>
    <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
  </section>

  <section class="side">
    <div class="pane output">
      <div class="pane-head">Output</div>
      <div class="pane-body"><pre class="out" id="out"></pre></div>
    </div>
    <div class="pane problems">
      <div class="pane-head">Problems <span class="count" id="count"></span></div>
      <div class="pane-body" id="problems"></div>
      <div class="summary" id="summary">Press Run to start.</div>
    </div>
  </section>
</main>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';

  var code = document.getElementById('code');
  var gutter = document.getElementById('gutter');
  var out = document.getElementById('out');
  var problemsBox = document.getElementById('problems');
  var count = document.getElementById('count');
  var summary = document.getElementById('summary');
  var examples = document.getElementById('examples');
  var STORE = 'kaviel.source';

  var SAMPLES = {
    hello:
'start\n' +
'print "Hello!"\n' +
'end\n',

    dice:
'start\n' +
'random 67\n' +
'  print "Wow!"\n' +
'random 33\n' +
'  print "Damn!"\n' +
'end\n',

    rps:
'start\n' +
'print "Rock, paper or scissors?"\n' +
'\n' +
'define you = ask("Rock, paper or scissors? ")\n' +
'define cpu = pick "rock", "paper", "scissors"\n' +
'\n' +
'if you = cpu\n' +
'  print "Tie."\n' +
'\n' +
'if you = "rock"\n' +
'  if cpu = "paper"\n' +
'    print "I chose paper. You lose."\n' +
'  if cpu = "scissors"\n' +
'    print "I chose scissors. You win!"\n' +
'\n' +
'if you = "paper"\n' +
'  if cpu = "rock"\n' +
'    print "I chose rock. You win!"\n' +
'  if cpu = "scissors"\n' +
'    print "I chose scissors. You lose."\n' +
'\n' +
'if you = "scissors"\n' +
'  if cpu = "rock"\n' +
'    print "I chose rock. You lose."\n' +
'  if cpu = "paper"\n' +
'    print "I chose paper. You win!"\n' +
'\n' +
'end\n',

    collatz:
'start\n' +
'define n = 27\n' +
'define steps = 1\n' +
'\n' +
'until n = 1\n' +
'  if n % 2 = 0\n' +
'    set n = n / 2\n' +
'  else\n' +
'    set n = n * 3 + 1\n' +
'  set steps = steps + 1\n' +
'\n' +
'print "done in " steps " steps"\n' +
'end\n',

    errors:
'start\n' +
'print "Hello!"\n' +
'prnt "this command does not exist"\n' +
'print 1 / 0\n' +
'define age = 8\n' +
'if age > 10\n' +
'  print "big"\n' +
'else\n' +
'  print "small"\n' +
'set points = 5\n' +
'print "I made it all the way to the end"\n' +
'end\n'
  };

  function lineCount(text) {
    return text.split('\n').length;
  }

  function saveSource() {
    try { localStorage.setItem(STORE, code.value); } catch (e) {}
  }

  function sourceChanged() {
    drawGutter();
    saveSource();
    examples.value = '';
    problemsBox.innerHTML = '<div class="empty">Source changed. Run to check it.</div>';
    count.textContent = '';
    summary.textContent = 'Source changed. Output is from the previous run.';
    summary.className = 'summary';
  }

  function indentSelection(unindent) {
    var start = code.selectionStart, end = code.selectionEnd;
    if (!unindent && start === end) {
      code.setRangeText('  ', start, end, 'end');
    } else {
      var first = code.value.lastIndexOf('\n', start - 1) + 1;
      if (start === 0) first = 0;
      // A selection ending at the next line's start does not include that line.
      var last = end > start && code.value[end - 1] === '\n' ? end - 1 : end;
      var block = code.value.slice(first, last);
      var lines = block.split('\n');
      var firstDelta = 0, totalDelta = 0;
      lines = lines.map(function (line, i) {
        var remove = unindent ? Math.min(2, (line.match(/^ */) || [''])[0].length) : 0;
        var delta = unindent ? -remove : 2;
        if (i === 0) firstDelta = delta;
        totalDelta += delta;
        return unindent ? line.slice(remove) : '  ' + line;
      });
      code.setRangeText(lines.join('\n'), first, last, 'preserve');
      code.setSelectionRange(Math.max(first, start + firstDelta), Math.max(first, end + totalDelta));
    }
    sourceChanged();
  }

  function drawGutter() {
    var n = lineCount(code.value);
    var html = '';
    for (var i = 1; i <= n; i++) html += '<div>' + i + '</div>';
    gutter.innerHTML = html;
    gutter.scrollTop = code.scrollTop;
  }

  function clearGutter() {
    var kids = gutter.children;
    for (var i = 0; i < kids.length; i++) kids[i].className = '';
  }

  function selectLine(line) {
    var lines = code.value.split('\n');
    var start = 0;
    for (var i = 0; i < line - 1 && i < lines.length; i++) start += lines[i].length + 1;
    var end = start + (lines[line - 1] ? lines[line - 1].length : 0);
    code.focus();
    code.setSelectionRange(start, end);
    var lineHeight = 22, top = (line - 1) * lineHeight;
    if (top < code.scrollTop || top > code.scrollTop + code.clientHeight - 60) {
      code.scrollTop = Math.max(0, top - code.clientHeight / 3);
      gutter.scrollTop = code.scrollTop;
    }
  }

  var running = false;

  function runIt() {
    if (running) return;
    running = true;
    saveSource();
    try {
      showResult(Kaviel.run(code.value, {
        input: function (question) {
          var a = window.prompt(question || 'Answer:', '');
          return a === null ? '' : a;
        }
      }));
    } catch (e) {
      out.textContent = '';
      problemsBox.textContent = 'The editor could not run this program. Your source is still saved.';
      count.textContent = '';
      clearGutter();
      summary.textContent = 'Editor error. You can try Run again.';
      summary.className = 'summary';
    } finally {
      running = false;
    }
  }

  function showResult(result) {
    out.textContent = result.output.join('\n');
    problemsBox.innerHTML = '';
    var marks = {};
    for (var i = 0; i < result.problems.length; i++) {
      var p = result.problems[i];
      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'problem ' + p.kind;
      var kindLabel = p.kind === 'error' ? 'error' : p.kind === 'warning' ? 'warning' : 'hint';
      row.innerHTML =
        '<span class="where"></span>' +
        '<span><span class="kind">' + kindLabel + '</span>' +
        '<span class="msg" style="display:block"></span>' +
        (p.hint ? '<span class="hint" style="display:block"></span>' : '') + '</span>';
      row.querySelector('.where').textContent = 'line ' + p.line;
      row.querySelector('.msg').textContent = p.message;
      if (p.hint) row.querySelector('.hint').textContent = p.hint;
      row.addEventListener('click', (function (line) {
        return function () { selectLine(line); };
      })(p.line));
      problemsBox.appendChild(row);
      if (p.kind === 'error' || p.kind === 'warning') {
        if (!marks[p.line] || p.kind === 'error') marks[p.line] = p.kind;
      }
    }
    clearGutter();
    Object.keys(marks).forEach(function (line) {
      var el = gutter.children[Number(line) - 1];
      if (el) el.className = marks[line];
    });
    if (result.problems.length === 0) {
      problemsBox.innerHTML = '<div class="ok" style="font-size:13px">No problems.</div>';
    }
    count.textContent = result.problems.length
      ? '· ' + result.problems.length + (result.problems.length === 1 ? ' problem' : ' problems')
      : '';
    summary.textContent = result.summary;
    summary.className = 'summary' + (result.problems.length ? '' : ' ok');
  }

  // Restore source without running it: loading a draft must not open prompts.
  var saved = null, fromHash = '';
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  try { fromHash = decodeURIComponent((location.hash || '').replace(/^#/, '')); } catch (e) {}
  if (Object.prototype.hasOwnProperty.call(SAMPLES, fromHash)) {
    code.value = SAMPLES[fromHash];
    examples.value = fromHash;
  } else code.value = saved !== null ? saved : SAMPLES.hello;
  drawGutter();
  problemsBox.innerHTML = '<div class="empty">Run to check your program.</div>';
  code.setAttribute('aria-label', 'Kaviel source code');
  examples.setAttribute('aria-label', 'Load an example');

  code.addEventListener('input', sourceChanged);
  code.addEventListener('scroll', function () { gutter.scrollTop = code.scrollTop; });
  code.addEventListener('paste', function (ev) {
    if (!ev.clipboardData) return;
    var text = ev.clipboardData.getData('text/plain');
    // Preserve the engine's four-space meaning for pasted indentation tabs.
    var normalized = text.replace(/\r\n?/g, '\n').replace(/^[ \t]*\t[ \t]*/gm, function (indent) {
      return indent.replace(/\t/g, '    ');
    });
    if (normalized === text) return;
    ev.preventDefault();
    code.setRangeText(normalized, code.selectionStart, code.selectionEnd, 'end');
    sourceChanged();
  });
  code.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) {
      ev.preventDefault();
      runIt();
    } else if (ev.key === 'Tab') {
      ev.preventDefault();
      indentSelection(ev.shiftKey);
    } else if (ev.key === 'Enter' && !ev.isComposing && !ev.altKey && !ev.shiftKey) {
      ev.preventDefault();
      var start = code.selectionStart;
      var first = start === 0 ? 0 : code.value.lastIndexOf('\n', start - 1) + 1;
      var before = code.value.slice(first, start);
      var indent = (before.match(/^ */) || [''])[0];
      if (/^\s*(if|else|repeat|until|random)\b/.test(before)) indent += '  ';
      code.setRangeText('\n' + indent, start, code.selectionEnd, 'end');
      sourceChanged();
    }
  });

  document.getElementById('run').addEventListener('click', runIt);
  examples.addEventListener('change', function () {
    var key = examples.value;
    if (!Object.prototype.hasOwnProperty.call(SAMPLES, key)) return;
    code.value = SAMPLES[key];
    sourceChanged();
    examples.value = key;
    out.textContent = '';
    summary.textContent = 'Example loaded. Press Run to start.';
    code.setSelectionRange(0, 0);
    code.scrollTop = 0;
    gutter.scrollTop = 0;
  });
})();
</script>
</body>
</html>
