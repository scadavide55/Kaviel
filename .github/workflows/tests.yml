name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The language
        run: node test.js
      - name: Thresholds, functions, lists, keys
        run: node v1-test.js
      - name: The command line
        run: node cli-test.js
      - name: The version is the same everywhere
        run: |
          engine=$(node -p "require('./engine.js').VERSION")
          package=$(node -p "require('./package.json').version")
          case "$engine" in "$package"*) echo "engine $engine matches package $package";; *) echo "engine $engine does not match package $package"; exit 1;; esac
